name: Build Manager

on:
  push:
    branches: [ "main", "dev", "ci" ]
    # Only run when files that affect the build (manager, kernel, userspace, tooling) change.
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/riscv64-cargo.toml'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/riscv64-cargo.toml'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_call:
    inputs:
      manager_arch:
        description: 'Comma-separated manager ABIs to package (release uses arm64-v8a)'
        required: false
        default: 'arm64-v8a,x86_64'
        type: string

jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      cert_sha256: ${{ steps.extract.outputs.cert_sha256 }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Generate temporary keystore
        if: github.event_name == 'pull_request'
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT

          keytool -genkeypair \
            -alias pr-key \
            -keyalg RSA -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=MKSU PR Build" \
            -storetype JKS \
            -keystore pr-key.jks

          echo "keystore=$(base64 -w 0 pr-key.jks)" >> $GITHUB_OUTPUT

      - name: Require release signing secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secrets:$missing"
            exit 1
          fi

      - name: Extract certificate hash and size
        id: extract
        env:
          STORE_PASS: ${{ github.event_name == 'pull_request' && steps.gen.outputs.keystore_password || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ github.event_name == 'pull_request' && 'pr-key' || secrets.KEY_ALIAS }}
          KEYSTORE_B64: ${{ github.event_name == 'pull_request' && steps.gen.outputs.keystore || secrets.KEYSTORE }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > signing-key.jks

          keytool -exportcert \
            -alias "$KEY_ALIAS" \
            -keystore signing-key.jks \
            -storepass "$STORE_PASS" \
            -file signing-cert.der

          SIZE_DEC=$(stat -c%s signing-cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          HASH=$(sha256sum signing-cert.der | awk '{print $1}')
          echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT
          echo "expected_hash=$HASH" >> $GITHUB_OUTPUT
          echo "cert_sha256=$HASH" >> $GITHUB_OUTPUT

          echo "Certificate size: $SIZE_HEX ($SIZE_DEC bytes)"
          echo "Certificate hash: $HASH"

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size: ${{ needs.generate-key.outputs.expected_size }}
      expected_hash: ${{ needs.generate-key.outputs.expected_hash }}
      manager_package: ${{ github.event_name == 'pull_request' && 'com.zeroedx.mksu.pr' || 'com.zeroedx.mksu' }}
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
          - target: riscv64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true
  
  build-ksud-extra:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-gnu # windows pc
            os: ubuntu-latest
          - target: x86_64-apple-darwin # Intel mac
            os: macos-latest
          - target: aarch64-apple-darwin # M chip mac
            os: macos-latest
          - target: aarch64-unknown-linux-musl # arm64 Linux
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl # x86 Linux
            os: ubuntu-latest
    uses: ./.github/workflows/ksud-extra.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      pack_lkm: true
      pack_ksuinit: true

  build-manager:
    needs: [generate-key]
    if: always() && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write release key
        if: github.event_name != 'pull_request'
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$PROD_KEYSTORE" ] || [ -z "$PROD_KEYSTORE_PASSWORD" ] || [ -z "$PROD_KEY_ALIAS" ] || [ -z "$PROD_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing; refusing to fall back to debug or upstream signing."
            exit 1
          fi
          echo "$PROD_KEYSTORE" | base64 -d > key.jks
          {
            echo KEYSTORE_PASSWORD="$PROD_KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$PROD_KEY_ALIAS"
            echo KEY_PASSWORD="$PROD_KEY_PASSWORD"
            echo KEYSTORE_FILE="$GITHUB_WORKSPACE/manager/key.jks"
          } >> gradle.properties

      - name: Write PR key
        if: github.event_name == 'pull_request'
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
          {
            echo KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
            echo KEY_ALIAS='pr-key'
            echo KEY_PASSWORD="$PR_KEY_PASSWORD"
            echo KEYSTORE_FILE="$GITHUB_WORKSPACE/manager/pr-key.jks"
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        env:
          MKSU_CERT_SHA256: ${{ needs.generate-key.outputs.cert_sha256 }}
          MANAGER_PACKAGE: ${{ github.event_name == 'pull_request' && 'com.zeroedx.mksu.pr' || 'com.zeroedx.mksu' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew clean assembleRelease \
              -PIS_PR_BUILD=true \
              -PKSU_PACKAGE_NAME="$MANAGER_PACKAGE" \
              -PKSU_NAME="MKSU PR" \
              -PMKSU_CERT_SHA256="$MKSU_CERT_SHA256"
          else
            ./gradlew clean assembleRelease \
              -PKSU_PACKAGE_NAME="$MANAGER_PACKAGE" \
              -PKSU_NAME="MKSU" \
              -PMKSU_CERT_SHA256="$MKSU_CERT_SHA256"
          fi

      # Repack input; cleanup-apk-artifacts removes it again on main, where only the signed APK is kept.
      - name: Upload build artifact
        if: ${{ github.event_name == 'pull_request' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) || github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        if: ${{ ( github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' )) || github.ref_type == 'tag' }}
        with:
          name: "mappings"
          path: "manager/app/build/outputs/mapping/release/"

  repack-manager:
    needs: [build-manager, build-ksud, generate-key]
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success' && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest
    env:
      # main ships one arm64-v8a build to Telegram; dev/PR keep the dual-ABI test package.
      MANAGER_ARCH: ${{ inputs.manager_arch || (github.ref == 'refs/heads/main' && 'arm64-v8a' || 'arm64-v8a,x86_64') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup need_upload
        id: need_upload
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          reason=""
          if [ "$EVENT_NAME" != "push" ]; then
            reason="event '$EVENT_NAME' is not a push"
          elif [ "$REF" != "refs/heads/main" ]; then
            reason="ref '$REF' is not refs/heads/main"
          elif [ -z "$BOT_TOKEN" ]; then
            reason="secret BOT_TOKEN is not set"
          elif [ -z "$CHAT_ID" ]; then
            reason="secret CHAT_ID is not set"
          fi

          if [ -n "$reason" ]; then
            echo "UPLOAD=false" >> "$GITHUB_OUTPUT"
            echo "[=] Telegram upload skipped: $reason"
          else
            echo "UPLOAD=true" >> "$GITHUB_OUTPUT"
            echo "[+] Telegram upload enabled: push to main with both secrets present"
          fi

      - name: Download gradle manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Download RISC-V ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-riscv64-linux-android
          path: artifacts/ksud-riscv64-linux-android

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/x86_64-linux-android/release
          mkdir -p target/riscv64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          RISCV64_KSUD=$(find artifacts/ksud-riscv64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$X86_64_KSUD"
          test -n "$RISCV64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/ksud
          cp -f "$RISCV64_KSUD" target/riscv64-linux-android/release/ksud

      - name: Prepare signing inputs
        if: ${{ github.event_name == 'pull_request' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) || github.ref_type == 'tag' }}
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
            echo "SIGN_KEYSTORE_FILE=pr-key.jks" >> $GITHUB_ENV
            echo "SIGN_KEY_ALIAS=pr-key" >> $GITHUB_ENV
            echo "SIGN_KEYSTORE_PASSWORD=$PR_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$PR_KEY_PASSWORD" >> $GITHUB_ENV
          else
            test -n "$PROD_KEYSTORE"
            echo "$PROD_KEYSTORE" | base64 -d > key.jks
            echo "SIGN_KEYSTORE_FILE=key.jks" >> $GITHUB_ENV
            echo "SIGN_KEY_ALIAS=$PROD_KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Repack and resign
        if: ${{ github.event_name == 'pull_request' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) || github.ref_type == 'tag' }}
        run: |
          ARCH_ARGS=""
          IFS=',' read -ra ARCHS <<< "$MANAGER_ARCH"
          for arch in "${ARCHS[@]}"; do
            ARCH_ARGS="$ARCH_ARGS -a $arch"
          done
          python3 repack_apk.py repack \
            -b release \
            -t release \
            $ARCH_ARGS \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      # The signed APK: dev/PR/tag use it as the test package, main keeps it for download next to Telegram.
      - name: Upload build artifact
        if: ${{ github.event_name == 'pull_request' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) || github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v7
        with:
          name: manager
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload to telegram
        id: telegram
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPARE_URL: ${{ github.event.compare }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          TITLE: MKSU Manager
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u

          APK=$(find ./dist -maxdepth 1 -type f -name "*.apk" | sort | head -n 1)
          if [ -z "$APK" ]; then
            echo "[-] Telegram upload failed: no signed APK in dist/"
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          read_version_code() {
            local apk="$1" tool bin code
            for tool in aapt2 aapt; do
              bin=$(command -v "$tool" || true)
              if [ -z "$bin" ]; then
                for candidate in "$SDK_ROOT"/build-tools/*/"$tool"; do
                  if [ -x "$candidate" ]; then
                    bin="$candidate"
                  fi
                done
              fi
              if [ -n "$bin" ]; then
                code=$("$bin" dump badging "$apk" 2>/dev/null | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1 || true)
                if [ -n "$code" ]; then
                  printf '%s' "$code"
                  return 0
                fi
              fi
            done
            return 1
          }

          VERSION=$(read_version_code "$APK" || true)
          if [ -z "$VERSION" ]; then
            # The repacked APK keeps the Gradle archive name, which ends with the versionCode.
            VERSION=$(basename "$APK" .apk | sed -n 's/.*_\([0-9][0-9]*\)\(-[A-Za-z0-9._]*\)\{0,1\}$/\1/p')
            if [ -n "$VERSION" ]; then
              echo "[!] Could not read versionCode with aapt2/aapt; using the APK file name: $VERSION"
            fi
          fi
          if [ -z "$VERSION" ]; then
            echo "[-] Telegram upload failed: cannot read versionCode from $APK"
            exit 1
          fi

          echo "[+] Uploading $(basename "$APK") (versionCode $VERSION, arch $MANAGER_ARCH) to $CHAT_ID"
          export VERSION

          if ! python3 -m pip install --quiet telethon; then
            echo "[-] Telegram upload failed: cannot install telethon"
            exit 1
          fi

          if python3 "$GITHUB_WORKSPACE/scripts/ksubot.py" "$APK"; then
            echo "[+] Telegram upload succeeded"
          else
            echo "[-] Telegram upload failed"
            exit 1
          fi

  cleanup-apk-artifacts:
    needs: [repack-manager]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the manager-gradle artifact of this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          list_artifacts() {
            gh api --paginate "/repos/$REPO/actions/runs/$RUN_ID/artifacts" > "$RUNNER_TEMP/artifacts.json"
            jq -s -r --arg name "$1" '.[].artifacts[] | select(.name == $name) | "\(.id) \(.name)"' \
              "$RUNNER_TEMP/artifacts.json"
          }

          list_artifacts manager-gradle > "$RUNNER_TEMP/gradle-artifacts.txt"
          if [ ! -s "$RUNNER_TEMP/gradle-artifacts.txt" ]; then
            echo "No manager-gradle artifact to delete"
          else
            while read -r id name; do
              echo "Deleting artifact $name ($id)"
              gh api -X DELETE "/repos/$REPO/actions/artifacts/$id"
            done < "$RUNNER_TEMP/gradle-artifacts.txt"
          fi

          remaining=$(list_artifacts manager-gradle | grep -c . || true)
          if [ "$remaining" -ne 0 ]; then
            echo "::error::$remaining manager-gradle artifact(s) still downloadable for this run"
            exit 1
          fi

          kept=$(list_artifacts manager | grep -c . || true)
          if [ "$kept" -eq 0 ]; then
            echo "::error::the signed manager APK artifact is missing from this run"
            exit 1
          fi
          echo "manager-gradle removed, $kept signed manager APK artifact(s) kept"
