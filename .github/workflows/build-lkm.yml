name: Build LKM for MKSU
on:
  workflow_call:
    inputs:
      expected_size:
        description: 'Expected manager certificate size (hex)'
        required: true
        type: string
      expected_hash:
        description: 'Expected manager certificate SHA-256'
        required: true
        type: string
      manager_package:
        description: 'Expected manager application id'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_size:
        description: 'Expected manager certificate size (hex)'
        required: true
        type: string
      expected_hash:
        description: 'Expected manager certificate SHA-256'
        required: true
        type: string
      manager_package:
        description: 'Expected manager application id'
        required: true
        type: string
jobs:
  build-lkm:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      expected_size: ${{ inputs.expected_size }}
      expected_hash: ${{ inputs.expected_hash }}
      manager_package: ${{ inputs.manager_package }}
